<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml" layout:decorate="~{common/frontCommon}">
	<head>
		<title th:text="${product.productName}"></title>
	</head>
	<body>
		<div id="content" layout:fragment="layoutContent">
			<main class="container" id="main-area">
				<article th:if="${product != null}" class="product-area" th:object="${product}">
					<div class="row">
						<div class="col-md-6 product-image">
							<iframe th:src="*{productImageUrl}" width="640" height="480" allow="autoplay"></iframe>
						</div>
						<div class="col-md-6 product-info">
							<div th:text="*{productName}" class="product-title"></div>
							<div th:text="|￥${#numbers.formatInteger(product.productPrice, 3, 'COMMA')}|" class="product-title"></div>
							<div class="product-content">
								<p th:text="*{productDescription}" ></p>
							</div>
							<div id="cart-area" class="cart-area">
								<button class="btn-cart" type="submit" onclick="window.alert('ダミーです'); return false;">
									<i class="fas fa-shopping-cart"></i>カートに追加
								</button>
							</div>
						</div>
					</div>
				</article>
			</main>
		</div>
	</body>
</html>
