<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:layout="http://ultraq.net.nz/thymeleaf/layout">
	<head>
		<meta charset="UTF-8">
		<title>apparel shop!</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
		<link href="../css/ecfront.css" rel="stylesheet">
		<link href="../css/cartpage.css" rel="stylesheet">
	</head>
	<body>
		<header>
			<div class="container">
				<div class="row">
		            <a class="top-header col-md-8"><h1>NOAR EC</h1></a>
		            <div class="memberCheck col-md-4">ようこそ、TEST様 保有ポイント：10,000ポイント</div>
				</div>
	        </div>
		</header>
		<div id="content">
            <main class="container" id="main-area">
                <h2>カート</h2>
                <div class="cart-message">以下のアイテムがカートに入っています。</div>
                <div class="items-area">
                    <div class="item-row">
                        <div class="item-thumnail">
                            <img src="../images/AS1098N769.jpg" width="160" height="120" />
                        </div>
                        <div class="item-details">
                            <div class="item-row product-name">
                                <span class="item-details-label">商品名：</span>ペットボトル再利用シャツ
                            </div>
                            <div class="item-row product-price">
                                <span class="item-details-label">価格：</span>￥30,000
                            </div>
                            <div class="item-row product-size">
                                <span class="item-details-label">サイズ：</span>L
                            </div>
                        </div>
                    </div>
                    <div class="item-row">
                        <div class="item-thumnail">
                            <img src="../images/BS542E3103.jpg" width="160" height="120" />
                        </div>
                        <div class="item-details">
                            <div class="item-row product-name">
                                <span class="item-details-label">商品名：</span>キャベツ柄スカート
                            </div>
                            <div class="item-row product-price">
                                <span class="item-details-label">価格：</span>￥15,000
                            </div>
                            <div class="item-row product-size">
                                <span class="item-details-label">サイズ：</span>F
                            </div>
                        </div>
                    </div>
                </div>
                <div class="product-total-price">
                    <span>小計：</span>
                    <span>￥45,000</span>
                </div>
                <div class="cart-button-area">
                    <button class="cart-to-placeorder" onclick="location.href='./deliveryAddress.html'; return false;">レジへ進む</button>
                    <button class="continue-shopping" onclick="location.href='./productDetail.html'; return false;">お買い物を続ける</button>
                </div>
            </main>
        </div>
       
        <footer>
			<div class="container text-center">
				<p class="copyright">&copy; 2025 NOAR. All rights reserved.</p>
			</div>
		</footer>
    </body>
</html>
