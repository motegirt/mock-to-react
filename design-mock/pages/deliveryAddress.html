<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:layout="http://ultraq.net.nz/thymeleaf/layout">
	<head>
		<meta charset="UTF-8">
		<title>apparel shop!</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
		<link href="../css/ecfront.css" rel="stylesheet">
		<link href="../css/cartpage.css" rel="stylesheet">
	</head>
	<body>
		<header>
			<div class="container">
				<div class="row">
		            <a class="top-header col-md-8"><h1>NOAR EC</h1></a>
		            <div class="memberCheck col-md-4">ようこそ、TEST様 保有ポイント：10,000ポイント</div>
				</div>
	        </div>
		</header>
		<div id="content">
            <main class="container" id="main-area">
                <h2>配送先入力</h2>
                <form>
                    <div class="form-row">
                        <span class="form-text-label">姓：</span><input type="text">
                        <span class="form-text-label">名：</span><input type="text">
                    </div>
                    <div class="form-row">
                        <span class="form-text-label">姓カナ：</span><input type="text">
                        <span class="form-text-label">名カナ：</span><input type="text">
                    </div>
                    <div class="form-row">
                        <span class="form-text-label">郵便番号：</span><input type="text">
                    </div>
                    <div class="form-row">
                        <span class="form-text-label">市区町村：</span>
                        <select>
                            <option>東京都</option>
                            <option>埼玉県</option>
                            <option>神奈川県</option>
                            <option>千葉県</option>
                        </select>
                    </div>
                </form>
                <div class="cart-button-area">
                    <button class="cart-to-placeorder" onclick="location.href='./deliveryAddress.html'; return false;">注文内容を確認する</button>
                    <button class="continue-shopping" onclick="location.href='./cart.html'; return false;">カートに戻る</button>
                </div>
            </main>
        </div>
       
        <footer>
			<div class="container text-center">
				<p class="copyright">&copy; 2025 NOAR. All rights reserved.</p>
			</div>
		</footer>
    </body>
</html>
