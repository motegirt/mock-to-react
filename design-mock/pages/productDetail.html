<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:layout="http://ultraq.net.nz/thymeleaf/layout">
	<head>
		<meta charset="UTF-8">
		<title>apparel shop!</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
		<link href="../css/ecfront.css" rel="stylesheet">
		<link href="../css/productdetail.css" rel="stylesheet">
	</head>
	<body>
		<header>
			<div class="container">
				<div class="row">
		            <a class="top-header col-md-8"><h1>NOAR EC</h1></a>
		            <div class="memberCheck col-md-4">ようこそ、TEST様 保有ポイント：10,000ポイント</div>
				</div>
	        </div>
		</header>
		<div id="content">
			<main class="container" id="main-area">
				<article class="product-area">
					<div class="row">
						<div class="col-md-6 product-image">
							<img src="../images/AS1098N769.jpg" width="480" height="360" />
						</div>
						<div class="col-md-6 product-info">
							<div class="product-title">ペットボトル再利用シャツ</div>
							<div class="product-title">￥30,000</div>
							<div class="product-content">
								<p>
                                    ペットボトルを再利用したシャツです。地球にやさしいです。
                                </p>
							</div>
							<div id="cart-area" class="cart-area">
                                <div class="size-area">
                                    <span class="size-notation">S</span>
                                    <button class="btn-cart" type="submit" onclick="location.href='./cart.html'; return false;">
                                        <i class="fas fa-shopping-cart"></i>カートに追加
                                    </button>
                                </div>
                                <div class="size-area">
                                    <span class="size-notation">M</span>
                                    <button class="btn-cart" type="submit" onclick="location.href='./cart.html'; return false;">
                                        <i class="fas fa-shopping-cart"></i>カートに追加
                                    </button>
                                </div>
                                <div class="size-area">
                                    <span class="size-notation">L</span>
                                    <button class="btn-cart" type="submit" onclick="location.href='./cart.html'; return false;">
                                        <i class="fas fa-shopping-cart"></i>カートに追加
                                    </button>
                                </div>
							</div>
						</div>
					</div>
				</article>
			</main>
		</div>
		<footer>
			<div class="container text-center">
				<p class="copyright">&copy; 2025 NOAR. All rights reserved.</p>
			</div>
		</footer>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
	</body>
</html>
