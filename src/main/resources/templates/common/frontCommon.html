<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:layout="http://ultraq.net.nz/thymeleaf/layout">
	<head>
		<meta charset="UTF-8">
		<title>apparel shop!</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
		<link th:href="@{/css/ecfront.css}" rel="stylesheet">
		<link th:href="@{/css/productdetail.css}" rel="stylesheet">
	</head>
	<body>
		<header>
			<div class="container">
				<div class="row">
		            <a class="top-header col-md-8"><h1>NOAR EC</h1></a>
		            <div class="memberCheck col-md-4" th:if="${#ctx.containsVariable('userName')}" th:text="|${userName}様 保有ポイント：${#numbers.formatInteger(availavlePoint, 3, 'COMMA')}ポイント|"></div>
	                <div class="memberCheck col-md-4" th:if="${#ctx.containsVariable('isGuest') and isGuest}"　th:text="ようこそ、ゲスト様"></div>
				</div>
	        </div>
		</header>
		<div id="content" layout:fragment="layoutContent">
		    <main id="main-area">
		            <div>Default Content</div>
		    </main>
		  </div>
		<footer>
			<div class="container text-center">
				<p class="copyright">&copy; 2025 NOAR. All rights reserved.</p>
			</div>
		</footer>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
	</body>
</html>
